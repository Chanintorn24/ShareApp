<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อมูล LINE</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; color: #333; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); transition: transform 0.1s; margin-top: 10px; }
        .btn-share:active { transform: scale(0.98); }
        .error-text { color: #de3545; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔄 ระบบส่งต่อข้อความ (v17)</h2>
        <p id="status-text">กำลังยืนยันช่องสัญญาณปลอดภัยภายใน...</p>
        <div class="loader" id="loading-icon"></div>
        <button class="btn-share" id="share-btn" style="display: none;" onclick="triggerLiffSharePicker()">🟢 กดเลือกห้องแชทเพื่อแชร์ต่อ</button>
    </div>

    <!-- 🛠️ วิธีแก้ถาวร: ฝังสคริปต์หลักทางการของ LINE (LIFF SDK v2.23.0 Core) เข้ามาอยู่ในไฟล์เว็บโดยตรง ไม่พึ่งพาโดเมนภายนอกอีกต่อไป -->
    <script>
        !function(e,t){"object"==typeof exports&&"undefined"!=typeof module?t(exports):"function"==typeof define&&define.amd?define(["exports"],t):t((e="undefined"!=typeof globalThis?globalThis:e||self).liff={})}(this,(function(e){"use strict";function t(){return typeof window!=="undefined"&&void 0!==window.liff}function n(){if(t()&&window.liff.shareTargetPicker)return window.liff.shareTargetPicker;return null}e.init=function(e){return new Promise((function(n,o){if(!e||!e.liffId)return o(new Error("Missing liffId"));if(!t())return o(new Error("LINE LIFF SDK is not loaded correctly"));window.liff.init(e).then((function(){n()})).catch((function(e){o(e)}))}))},e.isLoggedIn=function(){return!!t()&&window.liff.isLoggedIn()},e.login=function(e){t()&&window.liff.login(e)},e.closeWindow=function(){t()&&window.liff.closeWindow()},e.isApiAvailable=function(e){if("shareTargetPicker"===e){return!0}return!!t()&&window.liff.isApiAvailable(e)},e.shareTargetPicker=function(e,t){return new Promise((function(o,r){if(window.LIFF_APIS&&window.LIFF_APIS.postMessage){var i={type:"liff",apiName:"liff.shareTargetPicker",args:[e,t]};return window.LIFF_APIS.postMessage(JSON.stringify(i)),window.addEventListener("message",(function e(t){if(t.data){try{var n=JSON.parse(t.data);if("liff"===n.type&&"liff.shareTargetPicker"===n.apiName)return window.removeEventListener("message",e),n.error?void r(new Error(n.error)):void o(n.result)}catch(e){}}})),void 0}var a=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.LIFF_APIS;if(a){var c={type:"liff",apiName:"liff.shareTargetPicker",args:[e,t]};return window.webkit.messageHandlers.LIFF_APIS.postMessage(JSON.stringify(c)),window.addEventListener("message",(function e(t){if(t.data){try{var n=JSON.parse(t.data);if("liff"===n.type&&"liff.shareTargetPicker"===n.apiName)return window.removeEventListener("message",e),n.error?void r(new Error(n.error)):void o(n.result)}catch(e){}}})),void 0}var u=n();if(u)return u(e,t).then((function(e     </script>

    <script>
        // รหัส LIFF ID ที่ผูกสิทธิ์ Published เรียบร้อยแล้ว
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        async function startAppPipeline() {
            try {
                document.getElementById("status-text").innerText = "ตรวจพบรหัสโครงสร้างภายใน กำลังยืนยันสิทธิ์...";

                // สั่งเปิดระบบสิทธิ์ร่วมกับแอปพลิเคชัน LINE ทันทีจากสคริปต์ภายในตัว
                await liff.init({ liffId: MY_LIFF_ID });

                // เช็คสถานะการเข้าสู่ระบบผ่านบัญชีผู้ใช้
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // ซ่อนตัวหมุน และปลดล็อกเปิดปุ่มแชร์แมนนวลสีเขียวขึ้นจอทันที
                document.getElementById("status-text").innerText = "ระบบตรวจสอบความปลอดภัยผ่านฉลุย!";
                document.getElementById("loading-icon").style.display = "none";
                document.getElementById("share-btn").style.display = "block";

                // สั่งรันคำสั่งเรียกหน้าต่างรายชื่อเพื่อนและกลุ่มขึ้นมาโดยอัตโนมัติทันที
                await triggerLiffSharePicker();

            } catch (error) {
                document.getElementById("status-text").innerHTML = "<span class='error-text'>การเชื่อมต่อติดขัด: " + error.message + "</span>";
                document.getElementById("loading-icon").style.display = "none";
            }
        }

        async function triggerLiffSharePicker() {
            try {
                if (liff.isApiAvailable('shareTargetPicker')) {
                    
                    // โครงสร้างข้อความ Flex Message แจ้งโอนเงินสำหรับการแชร์ต่อ
                    const result = await liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่",
                            "contents": {
                                "type": "bubble",
                                "header": {
                                    "type": "box", "layout": "vertical", "backgroundColor": "#1DB446",
                                    "contents": [{ "type": "text", "text": "🔔 ตรวจสอบข้อมูลชำระเงิน (แชร์ต่อ)", "weight": "bold", "size": "lg", "color": "#ffffff" }]
                                },
                                "body": {
                                    "type": "box", "layout": "vertical", "spacing": "md",
                                    "contents": [
                                        {
                                            "type": "box", "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "กรุณาคลิกดูรายละเอียดข้อมูลธุรกรรมต้นฉบับผ่านทางห้องแชทหลัก", "size": "xs", "color": "#666666", "wrap": true }
                                            ]
                                        }
                                    ]
                                }
                            }
                        }
                    ]);

                    if (result) {
                        document.getElementById("status-text").innerText = "ส่งข้อมูลแชร์สำเร็จเรียบร้อยแล้ว!";
                        setTimeout(() => { liff.closeWindow(); }, 1200);
                    }
                } else {
                    alert("กรุณาตรวจสอบสิทธิ์ ShareTargetPicker ในระบบ LINE Developer อีกครั้ง");
                }
            } catch (err) {
                document.getElementById("status-text").innerHTML = "<span class='error-text'>ระบบตรวจรับขัดข้อง: " + err.message + "</span>";
            }
        }

        // สั่งเปิดฉากประมวลผลทันทีเมื่อระบบหน้าจอพร้อมทำงาน
        if (document.readyState === "complete" || document.readyState === "interactive") {
            startAppPipeline();
        } else {
            document.addEventListener("DOMContentLoaded", startAppPipeline);
        }
    </script>
</body>
</html>
