<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อความแจ้งชำระเงิน</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; color: #333; background-color: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
    
    <!-- ดึงคลังคำสั่งสิทธิ์ความปลอดภัยหลักตรงจาก LINE มาเตรียมสแตนด์บายล่วงหน้า -->
    <script src="https://line-scdn.net"></script>
</head>
<body>

    <div class="card">
        <div class="loader" id="loading-icon"></div>
        <h2 id="title-text">🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">ระบบความปลอดภัยพร้อมใช้งานแล้ว กรุณาเปิดปุ่มสีเขียวเพื่อส่งต่อการ์ดข้อมูล</p>
        <button class="btn-share" id="share-btn" onclick="executeSharePicker()">🟢 คลิกเปิดหน้าต่างแชร์เพื่อน</button>
    </div>

    <script>
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        const executeSharePicker = () => {
            // ดักเช็คตัวแปรคลังคำสั่งหลักเบื้องต้น
            if (typeof liff === "undefined") {
                alert("ระบบในเครื่องกำลังติดตั้งไฟล์ความปลอดภัยหลัก กรุณารอ 2 วินาทีแล้วกดปุ่มสีเขียวใหม่อีกครั้งครับ");
                return;
            }

            // แสดงหน้าจอประมวลผลหมุนเพื่อป้องกันการกดปุ่มซ้ำซ้อน
            document.getElementById("loading-icon").style.display = "block";
            document.getElementById("status-text").innerText = "กำลังเรียกหน้าต่างแสดงรายชื่อเพื่อน...";

            // 🟢 ควบรวมระบบ: สั่งเริ่มต้นระบบสิทธิ์ควบคู่ไปกับการเปิดหน้าแชร์เพื่อนทันทีที่กดคลิกปุ่มเพื่อปลดล็อก Android
            liff.init({ liffId: MY_LIFF_ID })
                .then(() => {
                    
                    // ดึงค่าพารามิเตอร์ Dynamic แปรผันส่งตรงมาจากโครงสร้างลิงก์ URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const amount = urlParams.get('amount') || "60,000"; 
                    const customer = urlParams.get('cus') || "CCCCCCC"; 

                    // ยิงฟังก์ชันแชร์การ์ด Flex Message ยอด ฿60,000 (ไม่มีรูปภาพสลิปบนหัวการ์ด) ทันที
                    liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "🔔 แจ้งชำระเงิน ยอด ฿" + amount,
                            "contents": {
                                "type": "bubble",
                                "header": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "backgroundColor": "#1DB446",
                                    "contents": [
                                        { "type": "text", "text": "🔔 แจ้งชำระเงินใหม่", "weight": "bold", "size": "md", "color": "#ffffff" }
                                    ]
                                },
                                "body": {
                                    "type": "box",
                                    "layout": "vertical",
                                    "spacing": "md",
                                    "contents": [
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "ยอดชำระเงิน:", "size": "sm", "color": "#666666", "weight": "bold" },
                                                { "type": "text", "text": "฿" + amount, "weight": "bold", "size": "lg", "color": "#1DB446", "align": "end" }
                                            ]
                                        },
                                        { "type": "separator" },
                                        {
                                            "type": "box",
                                            "layout": "vertical",
                                            "spacing": "xs",
                                            "contents": [
                                                {
                                                    "type": "box",
                                                    "layout": "horizontal",
                                                    "contents": [
                                                        { "type": "text", "text": "👤 ผู้แจ้ง:", "size": "xs", "color": "#666666" },
                                                        { "type": "text", "text": "P'Lek", "size": "xs", "color": "#111111", "align": "end", "weight": "bold" }
                                                    ]
                                                },
                                                {
                                                    "type": "box",
                                                    "layout": "horizontal",
                                                    "contents": [
                                                        { "type": "text", "text": "🏦 โอนเข้า:", "size": "xs", "color": "#666666" },
                                                        { "type": "text", "text": "บิลเลี่ยนแนร์ Kbank", "size": "xs", "color": "#111111", "align": "end" }
                                                    ]
                                                },
                                                {
                                                    "type": "box",
                                                    "layout": "horizontal",
                                                    "contents": [
                                                        { "type": "text", "text": "📅 วัน/เวลา:", "size": "xs", "color": "#666666" },
                                                        { "type": "text", "text": "2026-09-01 12:00", "size": "xs", "color": "#111111", "align": "end" }
                                                    ]
                                                }
                                            ]
                                        },
                                        { "type": "separator" },
                                        { "type": "text", "text": "📦 รายการอ้างอิงสินค้า", "weight": "bold", "size": "xs", "color": "#666666" },
                                        {
                                            "type": "box",
                                            "layout": "vertical",
                                            "contents": [
                                                { "type": "text", "text": "👤 ลค: " + customer + " (DO: -)", "weight": "bold", "size": "sm", "color": "#111111" }
                                            ]
                                        },
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "  • GKK24 (4 แคปซูล) (x300)", "size": "xs", "color": "#555555" },
                                                { "type": "text", "text": "฿" + amount + ".00", "size": "xs", "color": "#111111", "align": "end", "weight": "bold" }
                                            ]
                                        }
                                    ]
                                }
                            }
                        }
                    ])
                    .then((res) => {
                        document.getElementById("loading-icon").style.display = "none";
                        document.getElementById("status-text").innerText = "ระบบความปลอดภัยพร้อมใช้งานแล้ว กรุณาเปิดปุ่มสีเขียวเพื่อส่งต่อการ์ดข้อมูล";
                        if (res) {
                            liff.closeWindow(); // แชร์ข้อความเสร็จ บังคับปิดหน้าระบบทันที
                        }
                    })
                    .catch((shareError) => {
                        resetUI();
                        alert("ขั้นตอนดึงรายชื่อเพื่อนล้มเหลว: " + shareError.message);
                    });
                })
                .catch((initError) => {
                    resetUI();
                    alert("การยืนยันสิทธิ์ Token กับเซิร์ฟเวอร์ LINE ล้มเหลว: " + initError.message);
                });
        };

        function resetUI() {
            document.getElementById("loading-icon").style.display = "none";
            document.getElementById("status-text").innerText = "ระบบความปลอดภัยพร้อมใช้งานแล้ว กรุณาเปิดปุ่มสีเขียวเพื่อส่งต่อการ์ดข้อมูล";
        }
    </script>
</body>
</html>
