<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังดำเนินการส่งต่อข้อความ...</title>
    <!-- เรียกสคริปต์ทางการของ LINE เพื่อใช้ประมวลผลปิดหน้าต่างสากล -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; color: #333; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">กำลังจัดเตรียมข้อมูลธุรกรรมเพื่อส่งต่อ...</p>
        <div class="loader" id="loading-icon"></div>
        <button class="btn-share" id="share-btn" style="display: none;" onclick="redirectToLineShare()">🟢 จิ้มที่นี่เพื่อส่งเข้ากลุ่มอื่น</button>
    </div>

    <script>
        // รหัส LIFF ID ของคุณ
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // เริ่มต้นระบบตรวจสอบความปลอดภัยของ LINE
        liff.init({ liffId: MY_LIFF_ID }).then(() => {
            // สั่งรันคำสั่งวาร์ปสิทธิ์ส่งแชร์ต่อทันทีเมื่อระบบหลังบ้านเชื่อมต่อกันเสร็จสิ้น
            redirectToLineShare();
        }).catch((err) => {
            // หากรันผ่านระบบจำลองภายนอก ให้ระบบเปิดสิทธิ์ปุ่มกดสำรองเพื่อความปลอดภัย
            document.getElementById("status-text").innerText = "กรุณากดปุ่มด้านล่างเพื่อเลือกผู้รับ";
            document.getElementById("loading-icon").style.display = "none";
            document.getElementById("share-btn").style.display = "block";
        });

        // 🛠️ ฟังก์ชันทางออกของนักพัฒนา: ใช้ระบบสตรีมลิงก์สากล (LINE URL Scheme) บายพาสด่านบล็อกโล่เทาของ LINE
        function redirectToLineShare() {
            // ข้อความพาดหัวที่จะส่งพ่วงไปพร้อมกับการ์ด
            const textToShare = "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่\n\nกรุณาคลิกดูรายละเอียดผ่านลิงก์บันทึกข้อมูลธุรกรรม:";
            
            // ลิงก์ตัวเต็มของการ์ด Flex Message แจ้งโอนเงินที่จะถูกส่งกระจายต่อหาเพื่อนหรือกลุ่มอื่น
            const targetLiffUrl = "https://line.me" + MY_LIFF_ID;

            // ประกอบร่างโครงสร้าง URL Scheme ตามมาตรฐานการแชร์ภายนอกของ LINE 
            const lineShareEndpoint = "https://line.me?" + encodeURIComponent(textToShare + "\n" + targetLiffUrl);

            // ปรับแต่งข้อความบนหน้าจอก่อนทำการเปลี่ยนหน้าจอ
            document.getElementById("status-text").innerText = "กำลังเปิดหน้าต่างเลือกเพื่อน...";
            document.getElementById("loading-icon").style.display = "none";
            document.getElementById("share-btn").style.display = "block";

            // สั่งให้ตัวแอป LINE วาร์ปเปิดเข้าสู่หน้าต่างเลือกรายชื่อเพื่อนและกลุ่มแชทดั้งเดิมของเครื่องทันที 100%
            window.location.href = lineShareEndpoint;

            // หน่วงเวลาสั้นๆ เพื่อสั่งปิดหน้าต่างเว็บวิวสีขาวตามหลังโดยอัตโนมัติอย่างสวยงาม
            setTimeout(() => {
                if (typeof liff !== 'undefined' && liff.closeWindow) {
                    liff.closeWindow();
                }
            }, 2000);
        }
    </script>
</body>
</html>
