<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังดำเนินการแชร์ข้อความ...</title>
    <!-- นำเข้า SDK ของระบบ LINE LIFF (ขยับมาโหลดเร็วที่สุดที่ส่วนหัวการ์ด) -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; color: #333; background-color: #f9f9f9; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background-color: #1DB446; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 50px; cursor: pointer; display: none; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="loader" id="loading-icon"></div>
    <p id="status-text">กำลังเริ่มต้นระบบแชร์ข้อความ...</p>
    <button class="btn" id="retry-btn" onclick="openSharePicker()">คลิกเปิดหน้าต่างแชร์อีกครั้ง</button>

    <script>
        // 🚨 สำคัญมาก: กรุณาเปลี่ยนเป็นรหัส LIFF ID ของคุณที่ได้มาจาก LINE Developers Console
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        async function main() {
            try {
                // เพิ่มระบบตรวจสอบ: ถ้าระบบดาวน์โหลดไฟล์ LINE ล่าช้า ให้สั่งหน่วงเวลาเปิดรอ 200 มิลลิวินาที
                if (typeof liff === 'undefined') {
                    setTimeout(main, 200);
                    return;
                }

                // เริ่มต้นระบบ LIFF App
                await liff.init({ liffId: MY_LIFF_ID });

                // เช็คว่าล็อกอินบน LINE หรือยัง
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // สั่งรันฟังก์ชันเปิดหน้าต่างเลือกเพื่อนทันที
                await openSharePicker();

            } catch (error) {
                document.getElementById("status-text").innerText = "เกิดข้อผิดพลาดในการโหลดระบบ: " + error.message;
                document.getElementById("loading-icon").style.display = "none";
            }
        }

        async function openSharePicker() {
            try {
                document.getElementById("status-text").innerText = "กำลังเปิดหน้าต่างเลือกผู้รับ...";
                document.getElementById("retry-btn").style.display = "none";
                document.getElementById("loading-icon").style.display = "block";

                if (liff.isApiAvailable('shareTargetPicker')) {
                    
                    // 🛠️ โครงสร้างข้อความ Flex Message แจ้งโอนเงินสำหรับการแชร์ต่อ
                    const result = await liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่",
                            "contents": {
                                "type": "bubble",
                                "header": {
                                    "type": "box", "layout": "vertical", "backgroundColor": "#1DB446",
                                    "contents": [{ "type": "text", "text": "🔔 ตรวจสอบข้อมูลชำระเงิน (แชร์ต่อ)", "weight": "bold", "size": "lg", "color": "#ffffff" }]
                                },
                                "body": {
                                    "type": "box", "layout": "vertical", "spacing": "md",
                                    "contents": [
                                        {
                                            "type": "box", "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "กรุณาคลิกดูรายละเอียดข้อมูลธุรกรรมต้นฉบับผ่านทางห้องแชทหลัก", "size": "xs", "color": "#666666", "wrap": true }
                                            ]
                                        }
                                    ]
                                }
                            }
                        }
                    ]);

                    if (result) {
                        document.getElementById("status-text").innerText = "แชร์ข้อความเรียบร้อยแล้ว!";
                        document.getElementById("loading-icon").style.display = "none";
                        setTimeout(() => { liff.closeWindow(); }, 1500);
                    } else {
                        document.getElementById("status-text").innerText = "ยกเลิกการแชร์ข้อความ";
                        document.getElementById("loading-icon").style.display = "none";
                        document.getElementById("retry-btn").style.display = "inline-block";
                    }

                } else {
                    alert("กรุณาเปิดสิทธิ์ ShareTargetPicker เป็น Enable ใน LINE Login Channel ก่อนใช้งาน");
                    liff.closeWindow();
                }
            } catch (err) {
                document.getElementById("status-text").innerText = "ระบบแชร์ติดขัด: " + err.message;
                document.getElementById("loading-icon").style.display = "none";
                document.getElementById("retry-btn").style.display = "inline-block";
            }
        }

        // สั่งให้ระบบรอจนกว่าเบราว์เซอร์จะโหลดหน้าจอเสร็จสมบูรณ์ ค่อยเริ่มเปิดรันสคริปต์
        window.addEventListener('load', main);
    </script>
</body>
</html>
