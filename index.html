<script src="https://line-scdn.net"></script>
<script>
    // รหัส LIFF ID ของคุณ
    const MY_LIFF_ID = "2011437100-YADN8PIm"; 

    // เริ่มต้นระบบ LIFF 
    liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
            // เมื่อโหลดเสร็จแล้ว ตรวจสอบว่าผู้ใช้ล็อกอินหรือยัง
            if (!liff.isLoggedIn()) {
                liff.login(); // บังคับล็อกอินถ้ายังไม่ได้ล็อกอิน
            } else {
                openSharePicker(); // ถ้าล็อกอินแล้วให้เปิดหน้าต่างแชร์ทันที
            }
        })
        .catch((err) => {
            console.error("LIFF Initialization failed", err);
            document.getElementById("status-text").innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อระบบ LINE";
        });

    function openSharePicker() {
        // ตรวจสอบความพร้อมของฟังก์ชัน Share Target Picker
        if (liff.isApiAvailable('shareTargetPicker')) {
            
            // โครงสร้างข้อความที่คุณต้องการส่งแชร์ต่อ (กำหนดข้อความเป็น Flex หรือ Text ได้ที่นี่)
            liff.shareTargetPicker([
                {
                    "type": "text",
                    "text": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่\n\nกรุณาคลิกดูรายละเอียดผ่านลิงก์บันทึกข้อมูลธุรกรรม:\nhttps://liff.line.me/" + MY_LIFF_ID
                }
            ])
            .then((res) => {
                if (res) {
                    // ส่งแชร์สำเร็จ ปิดหน้าต่าง LIFF ทันที
                    liff.closeWindow();
                } else {
                    document.getElementById("status-text").innerText = "คุณยกเลิกการแชร์ข้อความ";
                    showBackupButton();
                }
            })
            .catch((error) => {
                console.error("TargetPicker error:", error);
                showBackupButton();
            });

        } else {
            document.getElementById("status-text").innerText = "ฟังก์ชันแชร์ไม่รองรับบนเบราว์เซอร์นี้";
            showBackupButton();
        }
    }

    function showBackupButton() {
        document.getElementById("share-btn").style.display = "block";
        document.getElementById("loading-icon").style.display = "none";
    }
</script>
