<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อความแจ้งชำระเงิน</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: center; padding: 50px 20px; color: #333; background-color: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="loader" id="loading-icon"></div>
        <h2 id="title-text">🔄 กำลังประมวลผล</h2>
        <p id="status-text">กำลังเรียกเปิดระบบแชร์รายชื่อของ LINE กรุณารอสักครู่...</p>
        <button class="btn-share" id="share-btn" onclick="openSharePicker()">🟢 คลิกเปิดหน้าต่างแชร์ใหม่อีกครั้ง</button>
    </div>

    <!-- เรียกใช้งาน LIFF SDK มาตรฐานจาก LINE -->
    <script src="https://line-scdn.net"></script>
    <script>
        // รหัส LIFF ID ของคุณที่สร้างจาก LINE Developers Console
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // เริ่มต้นเปิดระบบ LIFF SDK
        liff.init({ liffId: MY_LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login(); 
                } else {
                    // หากยืนยันตัวตนผ่านห้องแชทเรียบร้อยแล้ว ให้สั่งทำงานหน้าต่างแชร์ทันที
                    openSharePicker();
                }
            })
            .catch((err) => {
                console.error("LIFF Initialization failed", err);
                document.getElementById("title-text").innerText = "❌ เกิดข้อผิดพลาด";
                document.getElementById("status-text").innerText = "ไม่สามารถเชื่อมต่อระบบลงทะเบียนของ LINE ได้ในขณะนี้";
            });

        function openSharePicker() {
            if (liff.isApiAvailable('shareTargetPicker')) {
                
                // สั่งเปิดหน้าแชร์ เลือกส่งต่อข้อความแบบพิมพ์ธรรมดาควบคู่ไปกับลิงก์หลักฐาน
                liff.shareTargetPicker([
                    {
                        "type": "text",
                        "text": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่\n\nกรุณาคลิกดูรายละเอียดผ่านลิงก์บันทึกข้อมูลธุรกรรม:\nhttps://line.me" + MY_LIFF_ID
                    }
                ])
                .then((res) => {
                    if (res) {
                        // เมื่อแชร์เรียบร้อย ให้ปิดหน้าต่างเว็บเบราว์เซอร์ของ LINE ทันที
                        liff.closeWindow();
                    } else {
                        // กรณีผู้ใช้กดกากบาท (Cancel) หน้าต่างเลือกเพื่อน
                        document.getElementById("title-text").innerText = "ยกเลิกการทำงาน";
                        document.getElementById("status-text").innerText = "คุณได้ยกเลิกขั้นตอนการส่งต่อข้อความ";
                        showBackupButton();
                    }
                })
                .catch((error) => {
                    console.error("TargetPicker error:", error);
                    document.getElementById("title-text").innerText = "พบปัญหาการแชร์";
                    document.getElementById("status-text").innerText = "ระบบไม่สามารถดึงข้อมูลรายชื่อเพื่อนได้สำเร็จ";
                    showBackupButton();
                });

            } else {
                document.getElementById("title-text").innerText = "ระบบไม่รองรับ";
                document.getElementById("status-text").innerText = "ฟังก์ชันแชร์นี้จำเป็นต้องเปิดผ่านแอปพลิเคชัน LINE บนมือถือเท่านั้น";
                showBackupButton();
            }
        }

        function showBackupButton() {
            document.getElementById("share-btn").style.display = "block";
            document.getElementById("loading-icon").style.display = "none";
        }
    </script>
</body>
</html>
