<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อความแจ้งชำระเงิน</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; color: #333; background-color: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <div class="card">
        <div class="loader" id="loading-icon"></div>
        <h2 id="title-text">🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">กำลังเรียกเปิดระบบแชร์รายชื่อของ LINE กรุณารอสักครู่...</p>
        <button class="btn-share" id="share-btn" style="display: none;" onclick="openSharePicker()">🟢 คลิกเปิดหน้าต่างแชร์เพื่อน</button>
    </div>

    <!-- 🟢 ปรับกลับมาใช้ตัวยิงตรงหลักของ LINE เพื่อให้แอปยอมรับการเชื่อมต่อตามสิทธิ์ความปลอดภัย -->
    <script src="https://line-scdn.net"></script>
    <script>
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        function initLIFF() {
            // ดักเช็คว่าแอปโหลดตัวแปรของ LINE สำเร็จหรือไม่
            if (typeof liff !== "undefined") {
                liff.init({ liffId: MY_LIFF_ID })
                    .then(() => {
                        if (liff.isLoggedIn()) {
                            openSharePicker();
                        } else {
                            liff.login();
                        }
                    })
                    .catch((err) => {
                        document.getElementById("title-text").innerText = "❌ เกิดข้อผิดพลาด";
                        document.getElementById("status-text").innerText = "LINE Init ขัดข้อง: " + err;
                        showBackupButton();
                    });
            } else {
                // หากรันด่านแรกไม่ผ่าน ให้ทำการสั่งเปิดรีรันคำสั่งตรวจสอบซ้ำภายใน 300 มิลลิวินาที 
                setTimeout(initLIFF, 300);
            }
        }

        function openSharePicker() {
            if (liff.isApiAvailable('shareTargetPicker')) {
                liff.shareTargetPicker([
                    {
                        "type": "text",
                        "text": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่\n\nกรุณาคลิกดูรายละเอียดผ่านลิงก์บันทึกข้อมูลธุรกรรม:\nhttps://line.me"
                    }
                ])
                .then((res) => {
                    if (res) {
                        liff.closeWindow(); 
                    } else {
                        document.getElementById("title-text").innerText = "ยกเลิกการทำงาน";
                        document.getElementById("status-text").innerText = "คุณได้ยกเลิกขั้นตอนการส่งต่อข้อความ";
                        showBackupButton();
                    }
                })
                .catch((error) => {
                    document.getElementById("title-text").innerText = "พบข้อผิดพลาด";
                    document.getElementById("status-text").innerText = "เกิดปัญหาในขั้นตอนแชร์: " + error.message;
                    showBackupButton();
                });
            } else {
                document.getElementById("title-text").innerText = "ระบบไม่รองรับ";
                document.getElementById("status-text").innerText = "ฟังก์ชันแชร์นี้ไม่รองรับบนอุปกรณ์หรือบัญชีนี้";
                showBackupButton();
            }
        }

        function showBackupButton() {
            document.getElementById("share-btn").style.display = "block";
            document.getElementById("loading-icon").style.display = "none";
        }

        // สั่งให้เริ่มรันกระบวนการตรวจจับสิทธิ์ทันที
        initLIFF();
    </script>
</body>
</html>
