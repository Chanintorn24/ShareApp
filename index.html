<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อความแจ้งชำระเงิน</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; color: #333; background-color: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <div class="card">
        <div class="loader" id="loading-icon"></div>
        <h2 id="title-text">🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">กำลังเริ่มต้นระบบความปลอดภัย LINE...</p>
        <button class="btn-share" id="share-btn" onclick="openSharePicker()">🟢 คลิกเปิดหน้าต่างแชร์เพื่อน</button>
    </div>

    <script src="https://line-scdn.net"></script>
    <script>
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // สั่งให้ปุ่มแชร์เปิดโชว์รอไว้เลย เผื่อกรณีระบบโหลดอัตโนมัติค้าง
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                document.getElementById("status-text").innerText = "หากหน้าต่างไม่เปิดอัตโนมัติ กรุณากดปุ่มสีเขียวด้านล่าง";
                document.getElementById("loading-icon").style.display = "none";
            }, 1500);

            if (typeof liff !== "undefined") {
                // บังคับ liff.init ใหม่แบบไม่สนแคชเดิม
                liff.init({ liffId: MY_LIFF_ID, withLoginOnStart: true })
                    .then(() => {
                        document.getElementById("status-text").innerText = "เชื่อมต่อระบบ LINE สำเร็จ กำลังเปิดหน้าต่างแชร์...";
                        // ลองสั่งเปิดหน้าแชร์อัตโนมัติทันที
                        openSharePicker();
                    })
                    .catch((err) => {
                        document.getElementById("title-text").innerText = "❌ Init ไม่สำเร็จ";
                        document.getElementById("status-text").innerText = "ข้อผิดพลาดระบบ: " + err;
                    });
            } else {
                document.getElementById("title-text").innerText = "❌ เกิดข้อผิดพลาด";
                document.getElementById("status-text").innerText = "ไม่สามารถโหลด SDK ของ LINE ได้";
            }
        });

        function openSharePicker() {
            if (typeof liff === "undefined" || !liff.isLoggedIn()) {
                alert("ระบบ LINE ยังไม่พร้อมใช้งาน หรือยังไม่ได้เข้าสู่ระบบ");
                return;
            }

            if (liff.isApiAvailable('shareTargetPicker')) {
                liff.shareTargetPicker([
                    {
                        "type": "text",
                        "text": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่\n\nกรุณาคลิกดูรายละเอียดผ่านลิงก์บันทึกข้อมูลธุรกรรม:\nhttps://liff.line.me/" + MY_LIFF_ID
                    }
                ])
                .then((res) => {
                    if (res) {
                        liff.closeWindow(); // แชร์เสร็จปิดหน้าเว็บทันที
                    }
                })
                .catch((error) => {
                    alert("เกิดข้อผิดพลาดในการแชร์: " + error.message);
                });
            } else {
                alert("ฟังก์ชันแชร์นี้ไม่รองรับบนอุปกรณ์ของคุณ หรือคุณยังไม่ได้เปิดสิทธิ์ shareTargetPicker ใน LINE Console");
            }
        }
    </script>
</body>
</html>
