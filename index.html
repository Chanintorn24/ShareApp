<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังดำเนินการแชร์ข้อความ...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; color: #333; background-color: #f9f9f9; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background-color: #1DB446; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 50px; cursor: pointer; display: none; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="loader" id="loading-icon"></div>
    <p id="status-text">กำลังเริ่มต้นเชื่อมต่อระบบแชร์ข้อความ LINE...</p>
    <button class="btn" id="retry-btn" onclick="openSharePicker()">คลิกเปิดหน้าต่างแชร์อีกครั้ง</button>

    <!-- 🛠️ วิธีแก้ปัญหาค้าง: นำเข้าสคริปต์ของ LINE และสั่งให้ทำงานเริ่มต้นระบบในบรรทัดเดียวกันทันทีเมื่อดาวน์โหลดไฟล์เสร็จ -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" onload="main()"></script>

    <script>
        // 🚨 สำคัญมาก: กรุณากรอกรหัส LIFF ID สั้นๆ ของคุณ (เช่น 200xxxxxxx-xxxxxxx) ให้ถูกต้อง
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        async function main() {
            try {
                document.getElementById("status-text").innerText = "เชื่อมต่อสำเร็จ กำลังเปิดระบบแชร์...";

                // เริ่มต้นการระบุสิทธิ์ภายในระบบแอปพลิเคชัน
                await liff.init({ liffId: MY_LIFF_ID });

                // บังคับลงชื่อเข้าใช้งานของแอปพลิเคชันโดยอัตโนมัติ
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // เรียกฟังก์ชันเปิดหน้าต่างเลือกรายชื่อเพื่อนเพื่อกระจายข้อมูล
                await openSharePicker();

            } catch (error) {
                document.getElementById("status-text").innerText = "ระบบจับคู่ผิดพลาด: " + error.message;
                document.getElementById("loading-icon").style.display = "none";
            }
        }

        async function openSharePicker() {
            try {
                document.getElementById("status-text").innerText = "กำลังดึงหน้าต่างเลือกผู้รับจาก LINE...";
                document.getElementById("retry-btn").style.display = "none";
                document.getElementById("loading-icon").style.display = "block";

                // ตรวจสอบความถูกต้องของสิทธิ์ช่องสัญญาณแชร์ส่งต่อข้อมูล
                if (liff.isApiAvailable('shareTargetPicker')) {
                    
                    // 🛠️ ประกอบโครงสร้างชุดข้อความ Flex Message สำหรับแชร์ส่งต่อให้เพื่อนหรือกลุ่ม
                    const result = await liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่",
                            "contents": {
                                "type": "bubble",
                                "header": {
                                    "type": "box", "layout": "vertical", "backgroundColor": "#1DB446",
                                    "contents": [{ "type": "text", "text": "🔔 ตรวจสอบข้อมูลชำระเงิน (แชร์ต่อ)", "weight": "bold", "size": "lg", "color": "#ffffff" }]
                                },
                                "body": {
                                    "type": "box", "layout": "vertical", "spacing": "md",
                                    "contents": [
                                        {
                                            "type": "box", "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "กรุณาคลิกดูรายละเอียดข้อมูลธุรกรรมต้นฉบับผ่านทางห้องแชทหลัก", "size": "xs", "color": "#666666", "wrap": true }
                                            ]
                                        }
                                    ]
                                }
                            }
                        }
                    ]);

                    if (result) {
                        document.getElementById("status-text").innerText = "แชร์ข้อความเรียบร้อยแล้ว!";
                        document.getElementById("loading-icon").style.display = "none";
                        setTimeout(() => { liff.closeWindow(); }, 1500);
                    } else {
                        document.getElementById("status-text").innerText = "ยกเลิกการแชร์ข้อมูล";
                        document.getElementById("loading-icon").style.display = "none";
                        document.getElementById("retry-btn").style.display = "inline-block";
                    }

                } else {
                    alert("กรุณาเปิดสิทธิ์ ShareTargetPicker เป็น Enable ในช่องแชนเนล LINE Login ก่อนใช้งาน");
                    liff.closeWindow();
                }
            } catch (err) {
                document.getElementById("status-text").innerText = "ระบบส่งสัญลักษณ์ขัดข้อง: " + err.message;
                document.getElementById("loading-icon").style.display = "none";
                document.getElementById("retry-btn").style.display = "inline-block";
            }
        }
    </script>
</body>
</html>
