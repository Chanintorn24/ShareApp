<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อความแจ้งชำระเงิน</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; color: #333; background-color: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
    
    <!-- โหลดสคริปต์ความปลอดภัยมาตรฐานของ LINE ไว้ด้านบนสุด -->
    <script src="https://line-scdn.net"></script>
    <script>
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // 🟢 บังคับสั่งรันระบบเริ่มต้นความปลอดภัยทันทีที่หน้าเว็บโหลดตัวแปรเสร็จ
        liff.init({ liffId: MY_LIFF_ID })
            .then(function() {
                console.log("LIFF ready");
            })
            .catch(function(err) {
                console.log("LIFF error", err);
            });
    </script>
</head>
<body>

    <div class="card">
        <div class="loader" id="loading-icon"></div>
        <h2 id="title-text">🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">ระบบพร้อมทำงานแล้ว กรุณากดปุ่มสีเขียวด้านล่าง</p>
        <button class="btn-share" id="share-btn" onclick="openSharePicker()">🟢 คลิกเปิดหน้าต่างแชร์เพื่อน</button>
    </div>

    <script>
        // ปิดวงล้อหมุนล่วงหน้าเพื่อให้ปุ่มเปิดใช้งานได้แน่นอนบน Android
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("loading-icon").style.display = "none";
        });

        function openSharePicker() {
            // ดักเช็คและแก้ไขระบบเรียกใช้งาน Object แบบตรงข้ามเพื่อเลี่ยงการบล็อกสิทธิ์
            const currentLiff = window.liff || liff;

            if (typeof currentLiff === "undefined" || !currentLiff.shareTargetPicker) {
                alert("ตัวแอป LINE บนเครื่องยังโหลดสิทธิ์ความปลอดภัยไม่สมบูรณ์ กรุณาปิดหน้านี้แล้วลองกดเปิดใหม่อีกครั้งครับ");
                return;
            }

            // สั่งยิงโครงสร้างคำสั่งเปิดหน้ารายชื่อเพื่อนทันที
            currentLiff.shareTargetPicker([
                {
                    "type": "flex",
                    "altText": "🔔 แจ้งชำระเงิน ยอด ฿60,000",
                    "contents": {
                        "type": "bubble",
                        "header": {
                            "type": "box",
                            "layout": "vertical",
                            "backgroundColor": "#1DB446",
                            "contents": [
                                { "type": "text", "text": "🔔 แจ้งชำระเงินใหม่", "weight": "bold", "size": "lg", "color": "#ffffff" }
                            ]
                        },
                        "body": {
                            "type": "box",
                            "layout": "vertical",
                            "spacing": "md",
                            "contents": [
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "contents": [
                                        { "type": "text", "text": "ยอดชำระเงิน:", "size": "sm", "color": "#666666", "flex": 2, "weight": "bold" },
                                        { "type": "text", "text": "฿60,000", "weight": "bold", "size": "xl", "color": "#1DB446", "flex": 3, "align": "end" }
                                    ]
                                },
                                { "type": "separator" },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "spacing": "xs",
                                    "contents": [
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "👤 ผู้แจ้ง:", "size": "xs", "color": "#666666", "flex": 2 },
                                                { "type": "text", "text": "P'Lek", "size": "xs", "color": "#111111", "flex": 3, "weight": "bold" }
                                            ]
                                        },
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "🏦 โอนเข้า:", "size": "xs", "color": "#666666", "flex": 2 },
                                                { "type": "text", "text": "บิลเลี่ยนแนร์ Kbank", "size": "xs", "color": "#111111", "flex": 3 }
                                            ]
                                        },
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "📅 วัน/เวลา:", "size": "xs", "color": "#666666", "flex": 2 },
                                                { "type": "text", "text": "2026-09-01 12:00", "size": "xs", "color": "#111111", "flex": 3 }
                                            ]
                                        }
                                    ]
                                },
                                { "type": "separator" },
                                { "type": "text", "text": "📦 รายการอ้างอิงสินค้า", "weight": "bold", "size": "xs", "color": "#666666" },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "margin": "md",
                                    "contents": [
                                        { "type": "text", "text": "👤 ลค: CCCCCCC (DO: -)", "weight": "bold", "size": "sm", "color": "#111111" }
                                    ]
                                },
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "margin": "xs",
                                    "contents": [
                                        { "type": "text", "text": "  • GKK24 (4 แคปซูล) (x300)", "size": "xs", "color": "#555555", "flex": 3, "wrap": true },
                                        { "type": "text", "text": "฿60,000.00", "size": "xs", "color": "#111111", "align": "end", "weight": "bold", "flex": 2 }
                                    ]
                                }
                            ]
                        }
                    }
                }
            ])
            .then(function(res) {
                if (res) {
                    currentLiff.closeWindow(); // ส่งเสร็จสิ้นทำการปิดหน้าต่างทันที
                }
            })
            .catch(function(error) {
                alert("ระบบแจ้งข้อผิดพลาด: " + error.message);
            });
        }
    </script>
</body>
</html>
