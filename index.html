<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อความแจ้งชำระเงิน</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; color: #333; background-color: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 20px; display: block; margin-left: auto; margin-right: auto; transition: 0.3s; }
        .btn-share:disabled { background-color: #ccc; box-shadow: none; cursor: not-allowed; }
    </style>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

    <div class="card">
        <div class="loader" id="loading-icon" style="display: block;"></div>
        <h2 id="title-text">🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">กำลังดึงข้อมูลบิลและเชื่อมต่อระบบความปลอดภัย...</p>
        <button class="btn-share" id="share-btn" onclick="openSharePicker()" disabled>⏳ รอระบบประมวลผล</button>
    </div>

    <script>
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 
        // ⚠️ เอา Web App URL ที่ได้จากการ Deploy รอบล่าสุดมาใส่ตรงนี้
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPXvXZNanewpHlQR1j7ulaUUXcnwte4IBkKYaHn0K9nFl0eVWzRNOO8MpiOgjDh05UxQ/exec"; 
        
        let billData = null;

        async function initializeApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            if (idParam) {
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?id=${idParam}`);
                    const result = await response.json();
                    if (!result.error) billData = result;
                } catch (e) {
                    console.error("API Fetch Error:", e);
                }
            }

            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                document.getElementById('loading-icon').style.display = 'none';

                if (!billData) {
                    document.getElementById('status-text').innerText = '❌ ไม่พบข้อมูลบิล หรือข้อมูลเซสชันหมดอายุแล้ว (เกิน 6 ชม.)';
                    document.getElementById('status-text').style.color = 'red';
                    return; 
                }

                document.getElementById('status-text').innerText = 'ระบบพร้อมใช้งาน เลือกรายชื่อผู้รับได้เลย';
                const shareBtn = document.getElementById('share-btn');
                shareBtn.innerText = '🟢 คลิกเปิดหน้าต่างแชร์เพื่อน';
                shareBtn.disabled = false;

            } catch (err) {
                document.getElementById('status-text').innerText = 'ระบบมีปัญหา ไม่สามารถเชื่อมต่อ LINE ได้';
                document.getElementById('loading-icon').style.display = 'none';
            }
        }

        initializeApp();

        function openSharePicker() {
            if (!liff.isApiAvailable('shareTargetPicker')) {
                alert("แอป LINE ของคุณเวอร์ชันเก่า หรือไม่รองรับการแชร์");
                return;
            }
            if (!billData) return;

            let productContents = [];
            if (billData.refs && billData.refs.length > 0) {
                billData.refs.forEach(ref => {
                    productContents.push({
                        "type": "box", "layout": "vertical", "margin": "md",
                        "contents": [{ "type": "text", "text": `👤 ลค: ${ref.c} (DO: ${ref.do})`, "weight": "bold", "size": "sm", "color": "#111111", "wrap": true }]
                    });
                    if (ref.p && ref.p.length > 0) {
                        ref.p.forEach(prod => {
                            productContents.push({
                                "type": "box", "layout": "horizontal", "margin": "xs",
                                "contents": [
                                    { "type": "text", "text": `  • ${prod.n} (x${prod.q})${prod.f ? " แถม" : ""}`, "size": "xs", "color": "#555555", "flex": 3, "wrap": true },
                                    { "type": "text", "text": `฿${prod.t}`, "size": "xs", "color": "#111111", "align": "end", "weight": "bold", "flex": 2 }
                                ]
                            });
                        });
                    }
                });
            } else {
                productContents.push({
                    "type": "box", "layout": "vertical", "margin": "md",
                    "contents": [{ "type": "text", "text": "(ไม่มีรายการสินค้า)", "size": "sm", "style": "italic", "color": "#aaaaaa" }]
                });
            }

            const dynamicFlex = {
                "type": "flex",
                "altText": `🔔 แจ้งชำระเงิน ยอด ฿${billData.amt}`,
                "contents": {
                    "type": "bubble",
                    "header": {
                        "type": "box", "layout": "vertical", "backgroundColor": "#1DB446",
                        "contents": [{ "type": "text", "text": "🔔 แจ้งชำระเงินใหม่", "weight": "bold", "size": "md", "color": "#ffffff" }]
                    },
                    "body": {
                        "type": "box", "layout": "vertical", "spacing": "md",
                        "contents": [
                            {
                                "type": "box", "layout": "horizontal",
                                "contents": [
                                    { "type": "text", "text": "ยอดชำระเงิน:", "size": "sm", "color": "#666666", "weight": "bold" },
                                    { "type": "text", "text": `฿${billData.amt}`, "weight": "bold", "size": "lg", "color": "#1DB446", "align": "end" }
                                ]
                            },
                            { "type": "separator" },
                            {
                                "type": "box", "layout": "vertical", "spacing": "xs",
                                "contents": [
                                    { "type": "box", "layout": "horizontal", "contents": [{ "type": "text", "text": "👤 ผู้แจ้ง:", "size": "xs", "color": "#666666", "flex": 2 }, { "type": "text", "text": String(billData.rep), "size": "xs", "color": "#111111", "align": "end", "weight": "bold", "flex": 3, "wrap": true }] },
                                    { "type": "box", "layout": "horizontal", "contents": [{ "type": "text", "text": "🏦 โอนเข้า:", "size": "xs", "color": "#666666", "flex": 2 }, { "type": "text", "text": String(billData.bnk), "size": "xs", "color": "#111111", "align": "end", "flex": 3, "wrap": true }] },
                                    { "type": "box", "layout": "horizontal", "contents": [{ "type": "text", "text": "📅 วัน/เวลา:", "size": "xs", "color": "#666666", "flex": 2 }, { "type": "text", "text": String(billData.dt), "size": "xs", "color": "#111111", "align": "end", "flex": 3 }] },
                                    { "type": "box", "layout": "horizontal", "contents": [{ "type": "text", "text": "💳 ช่องทางชำระ:", "size": "xs", "color": "#666666", "flex": 2 }, { "type": "text", "text": String(billData.pm), "size": "xs", "color": "#111111", "align": "end", "flex": 3, "wrap": true }] }
                                ]
                            },
                            { "type": "separator" },
                            { "type": "text", "text": "📦 รายการอ้างอิงสินค้า", "weight": "bold", "size": "xs", "color": "#666666" },
                            { "type": "box", "layout": "vertical", "spacing": "xs", "contents": productContents }
                        ]
                    }
                }
            };

            liff.shareTargetPicker([dynamicFlex])
            .then(function(res) { if (res) liff.closeWindow(); })
            .catch(function(error) { console.error(error); });
        }
    </script>
</body>
</html>
