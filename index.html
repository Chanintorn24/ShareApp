<script src="https://line-scdn.net"></script>
<script>
    // สั่งรันคำสั่งทันทีที่ระบบสคริปต์พร้อมใช้งาน เพื่อลดปัญหาอาการหน่วงค้าง
    window.onload = function() {
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 
        
        liff.init({ liffId: MY_LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login(); 
                } else {
                    openSharePicker();
                }
            })
            .catch((err) => {
                console.error("LIFF Init Error:", err);
                document.getElementById("title-text").innerText = "❌ เชื่อมต่อไม่สำเร็จ";
                document.getElementById("status-text").innerText = "ไม่สามารถเชื่อมต่อสิทธิ์ LINE ได้: " + err.message;
                showBackupButton();
            });
    };

    function openSharePicker() {
        // เพิ่มตัวช่วยเช็คเผื่อกรณีตัวแอป LINE บนเครื่องปิดกั้นระบบความปลอดภัย
        try {
            if (liff.isApiAvailable('shareTargetPicker')) {
                liff.shareTargetPicker([
                    {
                        "type": "text",
                        "text": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่\n\nกรุณาคลิกดูรายละเอียดผ่านลิงก์บันทึกข้อมูลธุรกรรม:\nhttps://line.me"
                    }
                ])
                .then((res) => {
                    if (res) {
                        liff.closeWindow();
                    } else {
                        document.getElementById("title-text").innerText = "ยกเลิกการทำงาน";
                        document.getElementById("status-text").innerText = "คุณได้ยกเลิกขั้นตอนการส่งต่อข้อความ";
                        showBackupButton();
                    }
                })
                .catch((error) => {
                    document.getElementById("title-text").innerText = "พบข้อผิดพลาด";
                    document.getElementById("status-text").innerText = "เกิดปัญหาระหว่างเรียกรายชื่อ: " + error.message;
                    showBackupButton();
                });
            } else {
                document.getElementById("title-text").innerText = "ระบบไม่รองรับ";
                document.getElementById("status-text").innerText = "บัญชีนี้อาจยังไม่ได้เปิดสิทธิ์ shareTargetPicker ใน LINE Developer Console";
                showBackupButton();
            }
        } catch (e) {
            document.getElementById("title-text").innerText = "Fatal Error";
            document.getElementById("status-text").innerText = "สคริปต์ทำงานขัดข้อง: " + e.message;
            showBackupButton();
        }
    }

    function showBackupButton() {
        document.getElementById("share-btn").style.display = "block";
        document.getElementById("loading-icon").style.display = "none";
    }
</script>
