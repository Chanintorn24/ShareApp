<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อความแจ้งชำระเงิน</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; color: #333; background-color: #f4f7f6; margin: 0; }
        .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 25px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
    
    <!-- เรียกใช้งานคลังคำสั่งความปลอดภัยหลักจากเซิร์ฟเวอร์ LINE -->
    <script src="https://line-scdn.net"></script>
    <script>
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // เริ่มรันระบบเชื่อมโยง Token ล่วงหน้าทันทีที่เปิดหน้าเว็บ
        liff.init({ liffId: MY_LIFF_ID })
            .then(() => { console.log("LIFF Connected"); })
            .catch((err) => { console.error("LIFF Init Error: ", err); });
    </script>
</head>
<body>

    <div class="card">
        <div class="loader" id="loading-icon"></div>
        <h2 id="title-text">🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">ระบบความปลอดภัยพร้อมใช้งานแล้ว กรุณากดปุ่มสีเขียวด้านล่างเพื่อเลือกรายชื่อผู้รับ</p>
        <button class="btn-share" id="share-btn" onclick="openSharePicker()">🟢 คลิกเปิดหน้าต่างแชร์เพื่อน</button>
    </div>

    <script>
        function openSharePicker() {
            if (typeof liff === "undefined") {
                alert("ระบบในเครื่องกำลังประมวลผลสิทธิ์ กรุณารอ 1 วินาทีแล้วกดใหม่อีกครั้งครับ");
                return;
            }

            // 🟢 ส่งโครงสร้าง Flex Message แจ้งโอนเงินแบบ Clean JSON ที่แก้ไขจุดพิมพ์สัญลักษณ์ผิดพลาดแล้ว
            liff.shareTargetPicker([
                {
                    "type": "flex",
                    "altText": "🔔 แจ้งชำระเงิน ยอด ฿60,000",
                    "contents": {
                        "type": "bubble",
                        "header": {
                            "type": "box",
                            "layout": "vertical",
                            "backgroundColor": "#1DB446",
                            "contents": [
                                { "type": "text", "text": "🔔 แจ้งชำระเงินใหม่", "weight": "bold", "size": "md", "color": "#ffffff" }
                            ]
                        },
                        "body": {
                            "type": "box",
                            "layout": "vertical",
                            "spacing": "md",
                            "contents": [
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "contents": [
                                        { "type": "text", "text": "ยอดชำระเงิน:", "size": "sm", "color": "#666666", "weight": "bold" },
                                        { "type": "text", "text": "฿60,000", "weight": "bold", "size": "lg", "color": "#1DB446", "align": "end" }
                                    ]
                                },
                                { "type": "separator" },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "spacing": "xs",
                                    "contents": [
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "👤 ผู้แจ้ง:", "size": "xs", "color": "#666666" },
                                                { "type": "text", "text": "P'Lek", "size": "xs", "color": "#111111", "align": "end", "weight": "bold" }
                                            ]
                                        },
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "🏦 โอนเข้า:", "size": "xs", "color": "#666666" },
                                                { "type": "text", "text": "บิลเลี่ยนแนร์ Kbank", "size": "xs", "color": "#111111", "align": "end" }
                                            ]
                                        },
                                        {
                                            "type": "box",
                                            "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "📅 วัน/เวลา:", "size": "xs", "color": "#666666" },
                                                { "type": "text", "text": "2026-09-01 12:00", "size": "xs", "color": "#111111", "align": "end" }
                                            ]
                                        }
                                    ]
                                },
                                { "type": "separator" },
                                { "type": "text", "text": "📦 รายการอ้างอิงสินค้า", "weight": "bold", "size": "xs", "color": "#666666" },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "contents": [
                                        { "type": "text", "text": "👤 ลค: CCCCCCC (DO: -)", "weight": "bold", "size": "sm", "color": "#111111" }
                                    ]
                                },
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "contents": [
                                        { "type": "text", "text": "  • GKK24 (4 แคปซูล) (x300)", "size": "xs", "color": "#555555" },
                                        { "type": "text", "text": "฿60,000.00", "size": "xs", "color": "#111111", "align": "end", "weight": "bold" }
                                    ]
                                }
                            ]
                        }
                    }
                }
            ])
            .then((res) => {
                if (res) {
                    liff.closeWindow(); // แชร์ข้อความเสร็จสิ้น บังคับปิดหน้าระบบทันที
                }
            })
            .catch((error) => {
                alert("โครงสร้างการแชร์ผิดพลาด: " + error.message);
            });
        }
    </script>
</body>
</html>
