<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งต่อข้อมูล LINE</title>
    <!-- 🛠️ 1. นำเข้าสคริปต์ทางการของ LINE ผ่านช่องทางหลักที่ระบบ Android ยอมรับ 100% โดยตัดพารามิเตอร์ onload ออก -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; color: #333; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); transition: transform 0.1s; margin-top: 10px; }
        .btn-share:active { transform: scale(0.98); }
        .error-text { color: #de3545; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔄 ระบบส่งต่อข้อความ (v8)</h2>
        <p id="status-text">กำลังยืนยันช่องสัญญาณปลอดภัยผ่าน LINE CDN...</p>
        <div class="loader" id="loading-icon"></div>
        <button class="btn-share" id="share-btn" style="display: none;" onclick="triggerLiffSharePicker()">🟢 กดเลือกห้องแชทเพื่อแชร์ต่อ</button>
    </div>

    <script>
        // 🚨 รหัส LIFF ID ของคุณที่ถูกต้องแม่นยำ
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // ฟังก์ชันเริ่มการทำงานของแอปพลิเคชัน
        async function startAppPipeline() {
            try {
                // ระบบเซฟตี้แบบวนเช็ค: ป้องกันกรณีเบราว์เซอร์ดาวน์โหลดไฟล์ข้ามค่ายล่าช้า 
                if (typeof liff === 'undefined') {
                    document.getElementById("status-text").innerText = "กำลังดาวน์โหลดปลั๊กอินความปลอดภัยหลัก...";
                    setTimeout(startAppPipeline, 100);
                    return;
                }

                document.getElementById("status-text").innerText = "สแกนไฟล์ระบบสำเร็จ กำลังยืนยันสิทธิ์ถาวร...";
                
                // สั่งเปิดระบบสิทธิ์ร่วมกับแอปพลิเคชัน LINE
                await liff.init({ liffId: MY_LIFF_ID });

                // ตรวจเช็คสถานะการเข้าสู่ระบบผ่านบัญชีผู้ใช้
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // เมื่อสิทธิ์ผ่านฉลุย ให้ซ่อนรูปหมุนและเปิดปุ่มกดสีเขียวทันที
                document.getElementById("status-text").innerText = "ระบบยืนยันสิทธิ์ความปลอดภัยเรียบร้อยแล้ว!";
                document.getElementById("loading-icon").style.display = "none";
                document.getElementById("share-btn").style.display = "block";

                // สั่งให้หน้าต่างเลือกเพื่อนเด้งขึ้นมาโดยอัตโนมัติทันทีในรอบแรก
                await triggerLiffSharePicker();

            } catch (error) {
                document.getElementById("status-text").innerHTML = "<span class='error-text'>การเชื่อมต่อติดขัด: " + error.message + "</span>";
                document.getElementById("loading-icon").style.display = "none";
            }
        }

        // ฟังก์ชันสั่งเปิดหน้าต่างดึงรายชื่อเพื่อนและกลุ่มแชทขึ้นมาจากแอป LINE
        async function triggerLiffSharePicker() {
            try {
                if (liff.isApiAvailable('shareTargetPicker')) {
                    
                    // โครงสร้างข้อความ Flex Message แจ้งโอนเงินสำหรับการแชร์ต่อ
                    const result = await liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่",
                            "contents": {
                                "type": "bubble",
                                "header": {
                                    "type": "box", "layout": "vertical", "backgroundColor": "#1DB446",
                                    "contents": [{ "type": "text", "text": "🔔 ตรวจสอบข้อมูลชำระเงิน (แชร์ต่อ)", "weight": "bold", "size": "lg", "color": "#ffffff" }]
                                },
                                "body": {
                                    "type": "box", "layout": "vertical", "spacing": "md",
                                    "contents": [
                                        {
                                            "type": "box", "layout": "horizontal",
                                            "contents": [
                                                { "type": "text", "text": "กรุณาคลิกดูรายละเอียดข้อมูลธุรกรรมต้นฉบับผ่านทางห้องแชทหลัก", "size": "xs", "color": "#666666", "wrap": true }
                                            ]
                                        }
                                    ]
                                }
                            }
                        }
                    ]);

                    if (result) {
                        document.getElementById("status-text").innerText = "ส่งข้อมูลแชร์สำเร็จเรียบร้อยแล้ว!";
                        setTimeout(() => { liff.closeWindow(); }, 1200);
                    }
                } else {
                    alert("กรุณาตรวจสอบสิทธิ์ ShareTargetPicker ในระบบ LINE Developer อีกครั้ง");
                }
            } catch (err) {
                document.getElementById("status-text").innerHTML = "<span class='error-text'>ระบบตรวจรับขัดข้อง: " + err.message + "</span>";
            }
        }

        // ใช้คำสั่งรับเหตุการณ์ระดับสากล สั่งรันฟังก์ชันหลังจากระบบเบราว์เซอร์ Android วาดหน้าจอเสร็จสิ้นสมบูรณ์
        document.addEventListener("DOMContentLoaded", startAppPipeline);
    </script>
</body>
</html>
