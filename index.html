<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังดำเนินการส่งต่อข้อความ...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; color: #333; background-color: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 400px; margin: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1DB446; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-share { background-color: #1DB446; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(29, 180, 70, 0.3); margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔄 ระบบส่งต่อข้อความ</h2>
        <p id="status-text">กำลังเปิดหน้าต่างเลือกผู้รับในแอป LINE...</p>
        <div class="loader" id="loading-icon"></div>
        <button class="btn-share" id="share-btn" style="display: none;" onclick="redirectToLineShare()">🟢 คลิกที่นี่หากหน้าจอไม่เด้งอัตโนมัติ</button>
    </div>

    <script>
        // รหัส LIFF ID ของคุณ
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // 🛠️ ปลดล็อกด่านค้าง: สั่งประมวลผลเปลี่ยนเส้นทางหน้าจอทันทีแบบดีเลย์ 100 มิลลิวินาที 
        // โดยไม่ต้องเรียกใช้ liff.init() ให้ชนคิวระบบรักษาความปลอดภัยของ Android
        function redirectToLineShare() {
            // ข้อความที่จะส่งไปพร้อมกับการ์ด
            const textToShare = "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่\n\nกรุณาคลิกดูรายละเอียดผ่านลิงก์บันทึกข้อมูลธุรกรรม:";
            
            // ลิงก์สำหรับการ์ด Flex Message แจ้งโอนเงินที่จะถูกส่งกระจายต่อ
            const targetLiffUrl = "https://line.me" + MY_LIFF_ID;

            // ประกอบร่างโครงสร้าง URL Scheme ตามมาตรฐานการแชร์ของ LINE 
            const lineShareEndpoint = "https://line.me?" + encodeURIComponent(textToShare + "\n" + targetLiffUrl);

            // แสดงปุ่มกดเผื่อฉุกเฉิน
            document.getElementById("share-btn").style.display = "block";
            document.getElementById("loading-icon").style.display = "none";

            // สั่งเปิดหน้าต่างเลือกรายชื่อเพื่อนและกลุ่มแชทดั้งเดิมของเครื่องทันที
            window.location.href = lineShareEndpoint;
        }

        // สั่งให้สคริปต์ทำงานทันทีที่เบราว์เซอร์ Android เปิดอ่านหน้าเว็บโดยไม่ต้องรออีเวนต์อื่น
        setTimeout(redirectToLineShare, 100);
    </script>
</body>
</html>
