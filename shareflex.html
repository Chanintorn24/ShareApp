<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังดำเนินการส่งต่อข้อความ...</title>
    <!-- 1. ดึงไฟล์ปลั๊กอินสคริปต์หลักที่เป็นเวอร์ชันมาตรฐานและเป็นทางการของ LINE -->
    <script src="https://line-scdn.net"></script>
</head>
<body>

    <!-- หน้าระบบคลีนเพียวๆ สไตล์ตรงไปตรงมาเพื่อความปลอดภัย ไม่ใส่เอฟเฟกต์รูปหมุนให้ขัดคิวงาน -->
    <p>ระบบกำลังเปิดหน้าต่างส่งต่อข้อมูลของแอป LINE โปรดรอสักครู่...</p>

    <script>
        // ใส่รหัส LIFF ID ของคุณที่ผูกสิทธิ์สาธารณะ (Published) เรียบร้อยแล้ว
        const MY_LIFF_ID = "2011437100-YADN8PIm"; 

        // 🛠️ ถอดลูปแก้อาการค้าง: ใช้คำสั่งเชื่อมโยงคิวงาน .then() ดั้งเดิมตามรูปแบบในภาพคู่มือของคุณเป๊ะๆ 100%
        liff.init({ liffId: MY_LIFF_ID }).then(() => {
            if (!liff.isLoggedIn()) {
                // หากยังไม่ได้ล็อกอิน ให้พาไปลงทะเบียนตรวจสิทธิ์เปิดรับสัญญาณ
                liff.login();
            } else {
                // เมื่อระบบพร้อมใช้งานอย่างสมบูรณ์แบบ ให้สั่งเด้งหน้าต่าง Share Target Picker ขึ้นจอทันที
                liff.shareTargetPicker([
                    {
                        "type": "flex",
                        "altText": "🔔 แจ้งตรวจสอบข้อมูลชำระเงินใหม่",
                        "contents": {
                            "type": "bubble",
                            "header": {
                                "type": "box", "layout": "vertical", "backgroundColor": "#1DB446",
                                "contents": [{ "type": "text", "text": "🔔 ตรวจสอบข้อมูลชำระเงิน (แชร์ต่อ)", "weight": "bold", "size": "lg", "color": "#ffffff" }]
                            },
                            "body": {
                                "type": "box", "layout": "vertical", "spacing": "md",
                                        "contents": [
                                            {
                                                "type": "box", "layout": "horizontal",
                                                "contents": [
                                                    { "type": "text", "text": "กรุณาคลิกดูรายละเอียดข้อมูลธุรกรรมต้นฉบับผ่านทางห้องแชทหลัก", "size": "xs", "color": "#666666", "wrap": true }
                                                ]
                                            }
                                        ]
                                    }
                            }
                    }
                ]).then((res) => {
                    if (res) {
                        console.log("แชร์ข้อความสำเร็จ!");
                        liff.closeWindow(); // ปิดหน้าต่างสลัดตัวเองกลับสู่ห้องแชทหลักโดยอัตโนมัติหลังส่งงานเสร็จ
                    } else {
                        console.log("ผู้ใช้ยกเลิกการแชร์");
                        liff.closeWindow(); // หากกดยกเลิกก็ให้ปิดหน้าต่างกลับแชทเดิมเช่นกัน
                    }
                }).catch((error) => {
                    console.error("เกิดข้อผิดพลาดในการแชร์:", error);
                });
            }
        }).catch((err) => {
            console.error("เริ่มต้นระบบ LIFF ล้มเหลว:", err);
        });
    </script>
</body>
</html>
